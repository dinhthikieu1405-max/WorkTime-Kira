<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - WorkTime</title>

    <link rel="icon"
        type="image/png"
        href="favicon.png">

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <div class="auth-container">

        <h1>WorkTime</h1>

        <p>Đăng nhập tài khoản</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mật khẩu"
                required
            >

            <button type="submit">
                Đăng nhập
            </button>

        </form>

        <p id="message"></p>

        <p>
            Chưa có tài khoản?
            <a href="register.html">Đăng ký</a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="login.js"></script>

</body>

</html>
